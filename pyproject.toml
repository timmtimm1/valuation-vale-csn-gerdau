[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valuation-mineracao-siderurgia"
version = "0.1.0"
description = "Valuation de VALE3, CSNA3 e GGBR4: dados da CVM, planilha com fórmulas vivas e página interativa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=2.4.6",
]

[project.scripts]
valuation = "valuation.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valuation"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Textos mostrados na planilha: frases longas e sinais tipográficos (−, ×) de propósito.
"src/valuation/explicacoes.py" = ["E501", "RUF001"]
"src/valuation/planilha.py" = ["E501", "RUF001"]
"src/valuation/registro.py" = ["E501", "RUF001"]  # tabelas e links em Markdown

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
