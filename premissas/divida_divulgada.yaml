# Quanto custa a dívida de cada empresa, segundo o que ela mesma divulga.
#
# parcelas: como a empresa descreve a dívida. `indexador: dolar` traz a taxa ao ano em
#   dólar; `indexador: cdi` traz os pontos acima ou abaixo do CDI. `peso` é a fatia da
#   dívida naquele indexador.
# juros_pagos: usado quando a empresa não divulga custo médio. É o valor da linha
#   "Juros pagos" do fluxo de caixa entregue à CVM, em R$ milhões, dividido pela dívida
#   bruta média do ano.
#
# Daqui saem duas premissas:
# - juros pagos sobre a dívida (aba Projeção): a taxa como divulgada, na moeda da dívida;
# - custo da dívida no WACC: a mesma taxa trazida para reais. A parte em dólar é
#   convertida pela diferença de inflação entre Brasil e EUA, porque o resto do WACC
#   está em reais.

VALE3:
  parcelas:
    - {indexador: dolar, peso: 1.0, taxa: 0.056}
  fonte: >-
    Custo médio de 5,6% ao ano em dólar, depois de swaps (formulário 6-K do 2T26, SEC).

GGBR4:
  parcelas:
    - {indexador: dolar, peso: 0.53, taxa: 0.0613}
    - {indexador: cdi, peso: 0.46, taxa: -0.0015}
  fonte: >-
    53% da dívida em dólar a 6,13% ao ano e 46% em reais a CDI - 0,15% (formulário 6-K do
    2T26, SEC).

CSNA3:
  parcelas: []
  juros_pagos: {ano: 2025, valor: 4267.926}
  fonte: >-
    A CSN não divulga custo médio. Juros pagos em 2025 (R$ 4.268 mi, linha "Juros pagos"
    do fluxo de caixa na CVM) sobre a dívida bruta média do ano.
